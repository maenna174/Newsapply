<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>今日十条管理后台</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f6f3;
      --panel: #ffffff;
      --text: #202124;
      --muted: #687076;
      --line: #d9ded8;
      --green: #2e6f57;
      --green-soft: #e4eee9;
      --blue: #2d5f8f;
      --blue-soft: #e7eef7;
      --amber: #8a4d16;
      --amber-soft: #f3e7d5;
      --red: #b34b45;
      --red-soft: #f5e5e3;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "HarmonyOS Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      line-height: 1.55;
    }
    button, input, textarea, select {
      font: inherit;
    }
    button {
      border: 0;
      cursor: pointer;
    }
    .shell {
      max-width: 1180px;
      margin: 0 auto;
      padding: 22px 18px 42px;
    }
    .top {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: center;
      margin-bottom: 18px;
    }
    .brand {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .mark {
      width: 42px;
      height: 42px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: var(--green);
      color: #fff;
      font-weight: 800;
    }
    h1, h2, h3 {
      margin: 0;
      letter-spacing: 0;
      line-height: 1.2;
    }
    h1 { font-size: 24px; }
    h2 { font-size: 18px; }
    h3 { font-size: 15px; }
    .sub {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px;
    }
    .grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 380px;
      gap: 16px;
      align-items: start;
    }
    .side-stack {
      display: grid;
      gap: 16px;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }
    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 15px;
      border-bottom: 1px solid var(--line);
    }
    .section {
      display: grid;
      gap: 12px;
      padding: 15px;
      border-bottom: 1px solid var(--line);
    }
    .section:last-child {
      border-bottom: 0;
    }
    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    input, textarea, select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--text);
      outline: 0;
    }
    input {
      height: 40px;
      padding: 0 12px;
    }
    select {
      height: 40px;
      padding: 0 12px;
    }
    textarea {
      min-height: 360px;
      resize: vertical;
      padding: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      line-height: 1.55;
    }
    input:focus, textarea:focus, select:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(46, 111, 87, .12);
    }
    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .button {
      min-height: 38px;
      border-radius: 8px;
      padding: 0 13px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-weight: 800;
      white-space: nowrap;
    }
    .primary { background: var(--green); color: #fff; }
    .secondary { background: var(--green-soft); color: var(--green); }
    .blue { background: var(--blue-soft); color: var(--blue); }
    .danger { background: var(--red-soft); color: var(--red); }
    .metric-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    .metric {
      border-radius: 8px;
      background: #f8f9f6;
      padding: 12px;
      min-width: 0;
    }
    .metric strong {
      display: block;
      font-size: 20px;
      line-height: 1;
    }
    .metric span {
      color: var(--muted);
      font-size: 12px;
    }
    .list {
      display: grid;
      gap: 10px;
      padding: 15px;
    }
    .card {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      background: #fff;
    }
    .draft-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .draft-editor {
      display: grid;
      gap: 12px;
    }
    .edition-editor {
      display: grid;
      grid-template-columns: 160px 140px 1fr;
      gap: 10px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fafbf9;
    }
    .item-editor {
      display: grid;
      gap: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      background: #fff;
    }
    .item-editor-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .editor-grid {
      display: grid;
      grid-template-columns: 72px 1fr 150px 150px;
      gap: 10px;
    }
    .editor-grid .wide {
      grid-column: span 2;
    }
    .editor-grid .full {
      grid-column: 1 / -1;
    }
    .editor-grid textarea {
      min-height: 92px;
      font-family: inherit;
      font-size: 13px;
    }
    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 6px;
    }
    .tag {
      padding: 2px 7px;
      border-radius: 6px;
      background: var(--green-soft);
      color: var(--green);
      font-weight: 800;
    }
    .tag.draft { background: var(--amber-soft); color: var(--amber); }
    .tag.published { background: var(--green-soft); color: var(--green); }
    .status-pill {
      border-radius: 6px;
      padding: 3px 8px;
      background: var(--amber-soft);
      color: var(--amber);
      font-weight: 800;
    }
    .status-pill.ok {
      background: var(--green-soft);
      color: var(--green);
    }
    .field-label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }
    .empty {
      margin: 0;
      padding: 24px;
      text-align: center;
      color: var(--muted);
      border: 1px dashed var(--line);
      border-radius: 8px;
      background: #fafbf9;
    }
    .log {
      min-height: 130px;
      max-height: 260px;
      overflow: auto;
      background: #111815;
      color: #dce8df;
      border-radius: 8px;
      padding: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      white-space: pre-wrap;
    }
    .toast {
      position: fixed;
      left: 50%;
      bottom: 20px;
      transform: translateX(-50%);
      background: var(--text);
      color: #fff;
      border-radius: 8px;
      padding: 10px 14px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s ease;
      z-index: 20;
    }
    .toast.show { opacity: 1; }
    @media (max-width: 980px) {
      .grid, .top, .row, .metric-grid, .edition-editor, .editor-grid {
        grid-template-columns: 1fr;
      }
      .editor-grid .wide, .editor-grid .full {
        grid-column: auto;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="top">
      <div class="brand">
        <div class="mark">10</div>
        <div>
          <h1>今日十条管理后台</h1>
          <p class="sub">发布每日版本、查看最近版本。最后一步仍需人工确认。</p>
        </div>
      </div>
    </header>

    <section class="grid">
      <div class="panel">
        <div class="panel-head">
          <h2>发布每日版本</h2>
          <div class="buttons">
            <button id="loadTodayDraftButton" class="button secondary" type="button">载入今日草稿</button>
            <button id="qualityButton" class="button blue" type="button">质量检查</button>
            <button id="publishTodayDraftButton" class="button primary" type="button">发布今日草稿</button>
          </div>
        </div>
        <div class="section">
          <div class="metric-grid">
            <div class="metric"><strong id="dateMetric">-</strong><span>日期</span></div>
            <div class="metric"><strong id="itemMetric">0</strong><span>条目</span></div>
            <div class="metric"><strong id="sourceMetric">0</strong><span>来源</span></div>
            <div class="metric"><strong id="statusMetric">-</strong><span>状态</span></div>
          </div>
        </div>
        <textarea id="editionInput" hidden></textarea>
        <div class="section">
          <div class="draft-toolbar">
            <div>
              <h2>草稿可视化编辑</h2>
              <p class="sub">先载入今日草稿，编辑后做质量检查，确认无误再发布。</p>
            </div>
          </div>
          <div id="draftEditor" class="draft-editor">
            <p class="empty">点击“载入今日草稿”后，可在这里直接编辑 10 条新闻。</p>
          </div>
        </div>
      </div>

      <aside class="side-stack">
        <section class="panel">
          <div class="panel-head">
            <h2>后台配置</h2>
          </div>
          <div class="section">
            <input id="adminUrlInput" placeholder="Admin Function URL">
            <input id="adminTokenInput" type="password" placeholder="ADMIN_TOKEN">
            <p id="configHelp" class="sub">Token 输入后会自动保存在当前浏览器，下次打开同一后台地址会自动填入。</p>
          </div>
        </section>

        <section class="panel">
          <div class="panel-head">
            <h2>最近版本</h2>
            <button id="listButton" class="button secondary" type="button">刷新</button>
          </div>
          <div id="editionList" class="list">
            <p class="empty">尚未加载</p>
          </div>
        </section>

        <section class="panel">
          <div class="section">
            <h3>操作日志</h3>
            <div id="log" class="log"></div>
          </div>
        </section>
      </aside>
    </section>
  </main>
  <div id="toast" class="toast"></div>

  <script>
    const defaultAdminUrl = `${window.location.origin}/functions/v1/admin`;
    const nodes = {
      loadTodayDraftButton: document.getElementById('loadTodayDraftButton'),
      qualityButton: document.getElementById('qualityButton'),
      publishTodayDraftButton: document.getElementById('publishTodayDraftButton'),
      listButton: document.getElementById('listButton'),
      adminUrlInput: document.getElementById('adminUrlInput'),
      adminTokenInput: document.getElementById('adminTokenInput'),
      configHelp: document.getElementById('configHelp'),
      editionInput: document.getElementById('editionInput'),
      draftEditor: document.getElementById('draftEditor'),
      editionList: document.getElementById('editionList'),
      dateMetric: document.getElementById('dateMetric'),
      itemMetric: document.getElementById('itemMetric'),
      sourceMetric: document.getElementById('sourceMetric'),
      statusMetric: document.getElementById('statusMetric'),
      log: document.getElementById('log'),
      toast: document.getElementById('toast')
    };
    let currentDraft = null;
    const categoryOptions = [
      ['domestic', '国内'],
      ['international', '国际'],
      ['finance', '财经'],
      ['technology', '科技'],
      ['health', '健康'],
      ['education', '教育'],
      ['society', '社会'],
      ['sports', '体育'],
      ['perspective', '视角']
    ];

    function toast(text) {
      nodes.toast.textContent = text;
      nodes.toast.classList.add('show');
      window.clearTimeout(toast.timer);
      toast.timer = window.setTimeout(() => nodes.toast.classList.remove('show'), 1600);
    }

    function log(message) {
      const time = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      nodes.log.textContent = `[${time}] ${message}\n${nodes.log.textContent}`;
    }

    function chinaDate() {
      return new Intl.DateTimeFormat('en-CA', {
        timeZone: 'Asia/Shanghai',
        year: 'numeric',
        month: '2-digit',
        day: '2-digit'
      }).format(new Date());
    }

    function persistConfig() {
      localStorage.setItem('dailyten.adminUrl', nodes.adminUrlInput.value.trim());
      localStorage.setItem('dailyten.adminToken', nodes.adminTokenInput.value.trim());
      updateConfigHelp();
    }

    function loadConfig() {
      const savedAdminUrl = localStorage.getItem('dailyten.adminUrl') || '';
      if (savedAdminUrl.includes('supabase.co/functions/v1/admin')) {
        localStorage.setItem('dailyten.adminUrl', defaultAdminUrl);
        nodes.adminUrlInput.value = defaultAdminUrl;
      } else {
        nodes.adminUrlInput.value = savedAdminUrl || defaultAdminUrl;
      }
      nodes.adminTokenInput.value = localStorage.getItem('dailyten.adminToken') || '';
      updateConfigHelp();
    }

    function updateConfigHelp() {
      const token = nodes.adminTokenInput.value.trim();
      nodes.configHelp.textContent = token
        ? '已在当前浏览器记住 Admin Token。更换浏览器、无痕模式、清理网站数据或换域名/IP 时需要重新填写。'
        : 'Token 输入后会自动保存在当前浏览器，下次打开同一后台地址会自动填入。';
    }

    function adminUrl(path = '') {
      return `${nodes.adminUrlInput.value.trim().replace(/\/$/, '')}${path}`;
    }

    async function adminFetch(path, options = {}) {
      const token = nodes.adminTokenInput.value.trim();
      if (!token) {
        throw new Error('请先填写 ADMIN_TOKEN');
      }
      persistConfig();
      const response = await fetch(adminUrl(path), {
        ...options,
        headers: {
          Authorization: `Bearer ${token}`,
          Accept: 'application/json',
          ...(options.body ? { 'Content-Type': 'application/json' } : {}),
          ...(options.headers || {})
        }
      });
      const text = await response.text();
      const body = text ? JSON.parse(text) : null;
      if (!response.ok) {
        const details = Array.isArray(body?.errors) ? `：${body.errors.join('；')}` : '';
        const error = new Error(body?.message || `${body?.error || `HTTP ${response.status}`}${details}`);
        error.body = body;
        throw error;
      }
      return body;
    }

    function parseEdition() {
      const text = nodes.editionInput.value.trim();
      if (!text) {
        throw new Error('请先导入或粘贴每日版本 JSON');
      }
      return JSON.parse(text);
    }

    function setEditionPayload(payload, message = '') {
      currentDraft = payload;
      nodes.editionInput.value = JSON.stringify(payload, null, 2);
      updateMetrics();
      renderDraftEditor();
      if (message) {
        log(message);
      }
    }

    function updateMetrics() {
      try {
        const payload = parseEdition();
        const items = Array.isArray(payload.items) ? payload.items : [];
        const sources = new Set(items.map((item) => {
          const source = item.article?.source;
          return typeof source === 'string' ? source : source?.name;
        }).filter(Boolean));
        nodes.dateMetric.textContent = payload.edition?.date || '-';
        nodes.itemMetric.textContent = String(items.length);
        nodes.sourceMetric.textContent = String(sources.size);
        nodes.statusMetric.textContent = payload.edition?.status || '-';
      } catch (_) {
        nodes.dateMetric.textContent = '-';
        nodes.itemMetric.textContent = '0';
        nodes.sourceMetric.textContent = '0';
        nodes.statusMetric.textContent = '-';
      }
    }

    function formatQuality(quality) {
      const issues = quality?.issues || [];
      if (issues.length === 0) {
        return '质量检查通过，未发现明显问题。';
      }
      return issues.map((issue) => `${issue.level === 'error' ? '错误' : '提醒'}：${issue.message}`).join(' | ');
    }

    async function qualityCheckCurrent() {
      const payload = parseEdition();
      const result = await adminFetch('/editions/quality', {
        method: 'POST',
        body: JSON.stringify(payload)
      });
      log(`质量检查: ${formatQuality(result.quality)}`);
      toast(result.quality?.warnings ? `有 ${result.quality.warnings} 个提醒` : '质量检查通过');
      return result.quality;
    }

    async function loadTodayDraft() {
      const date = chinaDate();
      try {
        await loadEditionDetail(date, 'cn', 'zh-CN');
        log(`今日草稿已载入: ${date}`);
      } catch (error) {
        if (error.body?.error === 'edition_not_found') {
          log(`${date} 今日草稿还没生成。自动任务每天 00:10 生成；如果刚过零点打开后台，可以先等自动任务，或手动运行生稿任务。`);
          toast('今日草稿还没生成');
          await listEditions().catch(() => {});
          return;
        }
        throw error;
      }
    }

    async function publishTodayDraft(allowWarnings = false) {
      const date = chinaDate();
      let result;
      try {
        result = await adminFetch('/editions/publish-draft', {
          method: 'POST',
          body: JSON.stringify({ date, region: 'cn', language: 'zh-CN', allowWarnings })
        });
      } catch (error) {
        if (error.body?.error === 'quality_warnings') {
          const text = formatQuality(error.body.quality);
          log(`发布今日草稿前有质量提醒: ${text}`);
          const confirmed = window.confirm(`发布前有质量提醒：\n\n${text}\n\n仍然发布 ${date} 今日草稿吗？`);
          if (confirmed) {
            return publishTodayDraft(true);
          }
          toast('已取消发布');
          return;
        }
        if (error.body?.quality) {
          log(`发布今日草稿被质量检查拦截: ${formatQuality(error.body.quality)}`);
        }
        throw error;
      }
      log(`今日草稿已发布: ${JSON.stringify(result.edition)}；${formatQuality(result.quality)}`);
      toast('今日草稿已发布');
      await listEditions();
      await loadEditionDetail(date, 'cn', 'zh-CN').catch(() => {});
    }

    async function listEditions() {
      const result = await adminFetch('/editions?limit=12');
      const editions = result.editions || [];
      if (editions.length === 0) {
        nodes.editionList.innerHTML = '<p class="empty">暂无版本</p>';
        return;
      }
      nodes.editionList.innerHTML = editions.map((edition) => `
        <article class="card">
          <div class="meta">
            <span class="tag ${edition.status === 'published' ? 'published' : 'draft'}">${escapeHtml(edition.status)}</span>
            <span>${escapeHtml(edition.region)} / ${escapeHtml(edition.language)}</span>
          </div>
          <h3>${escapeHtml(edition.edition_date)}</h3>
          <p class="sub">${escapeHtml(edition.statement || '')}</p>
          <div class="buttons">
            <button class="button secondary load-edition-button" type="button" data-date="${escapeHtml(edition.edition_date)}" data-region="${escapeHtml(edition.region)}" data-language="${escapeHtml(edition.language)}">编辑</button>
          </div>
        </article>
      `).join('');
      log(`已加载最近版本 ${editions.length} 个`);
    }

    async function loadEditionDetail(date, region = 'cn', language = 'zh-CN') {
      const query = new URLSearchParams({ date, region, language });
      const result = await adminFetch(`/editions/detail?${query.toString()}`);
      setEditionPayload(result, `已载入 ${date} 草稿/版本`);
      toast('版本已载入编辑器');
    }

    function renderDraftEditor() {
      let payload;
      try {
        payload = parseEdition();
      } catch (_) {
        currentDraft = null;
        nodes.draftEditor.innerHTML = '<p class="empty">点击“载入今日草稿”后，可在这里直接编辑 10 条新闻。</p>';
        return;
      }
      const items = Array.isArray(payload.items) ? payload.items : [];
      currentDraft = payload;
      if (items.length === 0) {
        nodes.draftEditor.innerHTML = '<p class="empty">当前 JSON 没有 items，无法渲染编辑器。</p>';
        return;
      }
      const edition = payload.edition || {};
      nodes.draftEditor.innerHTML = `
        <div class="edition-editor">
          <label class="field-label">日期
            <input data-scope="edition" data-field="date" value="${escapeHtml(edition.date || '')}">
          </label>
          <label class="field-label">状态
            <select data-scope="edition" data-field="status">
              ${['draft', 'published'].map((status) => `<option value="${status}" ${edition.status === status ? 'selected' : ''}>${status}</option>`).join('')}
            </select>
          </label>
          <label class="field-label">声明
            <input data-scope="edition" data-field="statement" value="${escapeHtml(edition.statement || '')}">
          </label>
        </div>
        ${items.map((item, index) => renderDraftItem(item, index)).join('')}
      `;
    }

    function renderDraftItem(item, index) {
      const article = item.article || {};
      const source = typeof article.source === 'object' && article.source ? article.source : { name: article.source || '', homepageUrl: '' };
      const category = article.category || 'society';
      return `
        <article class="item-editor">
          <div class="item-editor-head">
            <h3>#${index + 1} ${escapeHtml(article.title || '未命名新闻')}</h3>
            <span class="tag">${escapeHtml(category)}</span>
          </div>
          <div class="editor-grid">
            <label class="field-label">序号
              <input data-scope="item" data-index="${index}" data-field="position" type="number" min="1" max="10" value="${escapeHtml(item.position || index + 1)}">
            </label>
            <label class="field-label wide">标题
              <input data-scope="article" data-index="${index}" data-field="title" value="${escapeHtml(article.title || '')}">
            </label>
            <label class="field-label">分类
              <select data-scope="article" data-index="${index}" data-field="category">
                ${categoryOptions.map(([value, label]) => `<option value="${value}" ${category === value ? 'selected' : ''}>${label}</option>`).join('')}
              </select>
            </label>
            <label class="field-label">来源
              <input data-scope="source" data-index="${index}" data-field="name" value="${escapeHtml(source.name || '')}">
            </label>
            <label class="field-label wide">原文链接
              <input data-scope="article" data-index="${index}" data-field="url" value="${escapeHtml(article.url || '')}">
            </label>
            <label class="field-label">来源主页
              <input data-scope="source" data-index="${index}" data-field="homepageUrl" value="${escapeHtml(source.homepageUrl || '')}">
            </label>
            <label class="field-label">发布时间
              <input data-scope="article" data-index="${index}" data-field="publishedAt" value="${escapeHtml(article.publishedAt || '')}">
            </label>
            <label class="field-label full">摘要
              <textarea data-scope="article" data-index="${index}" data-field="summary">${escapeHtml(article.summary || '')}</textarea>
            </label>
            <label class="field-label full">入选理由
              <textarea data-scope="item" data-index="${index}" data-field="selectionReason">${escapeHtml(item.selectionReason || '')}</textarea>
            </label>
          </div>
        </article>
      `;
    }

    function syncDraftFromEditor(event) {
      const target = event.target;
      if (!target?.dataset?.scope || !currentDraft) {
        return;
      }
      const scope = target.dataset.scope;
      const field = target.dataset.field;
      const value = field === 'position' ? Number(target.value) : target.value;
      if (scope === 'edition') {
        currentDraft.edition = currentDraft.edition || {};
        currentDraft.edition[field] = value;
      } else {
        const index = Number(target.dataset.index);
        const item = currentDraft.items?.[index];
        if (!item) {
          return;
        }
        if (scope === 'item') {
          item[field] = value;
        }
        if (scope === 'article') {
          item.article = item.article || {};
          item.article[field] = value;
        }
        if (scope === 'source') {
          item.article = item.article || {};
          if (!item.article.source || typeof item.article.source !== 'object') {
            item.article.source = { name: String(item.article.source || ''), homepageUrl: '' };
          }
          item.article.source[field] = value;
        }
      }
      nodes.editionInput.value = JSON.stringify(currentDraft, null, 2);
      updateMetrics();
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    nodes.editionInput.addEventListener('input', updateMetrics);
    nodes.adminUrlInput.addEventListener('input', persistConfig);
    nodes.adminTokenInput.addEventListener('input', persistConfig);
    nodes.draftEditor.addEventListener('input', syncDraftFromEditor);
    nodes.editionList.addEventListener('click', (event) => {
      const button = event.target.closest('.load-edition-button');
      if (!button) {
        return;
      }
      loadEditionDetail(button.dataset.date, button.dataset.region, button.dataset.language).catch((error) => {
        log(`载入版本失败: ${error.message}`);
        toast('载入版本失败');
      });
    });
    nodes.loadTodayDraftButton.addEventListener('click', () => loadTodayDraft().catch((error) => {
      log(`载入今日草稿失败: ${error.message}`);
      toast('载入今日草稿失败');
    }));
    nodes.qualityButton.addEventListener('click', () => qualityCheckCurrent().catch((error) => {
      const quality = error.body?.quality;
      log(`质量检查未通过: ${quality ? formatQuality(quality) : error.message}`);
      toast('质量检查未通过');
    }));
    nodes.publishTodayDraftButton.addEventListener('click', () => publishTodayDraft().catch((error) => {
      log(`发布今日草稿失败: ${error.message}`);
      toast('发布今日草稿失败');
    }));
    nodes.listButton.addEventListener('click', () => listEditions().catch((error) => {
      log(`加载失败: ${error.message}`);
      toast('加载失败');
    }));

    loadConfig();
    updateMetrics();
    listEditions().catch(() => {});
  </script>
</body>
</html>
