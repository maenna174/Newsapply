<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>今日十条</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f2;
      --paper: #ffffff;
      --text: #202124;
      --muted: #687076;
      --line: #d9ded8;
      --green: #2e6f57;
      --green-soft: #e4eee9;
      --amber: #8a4d16;
      --amber-soft: #f3e7d5;
      --red: #b34b45;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "HarmonyOS Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      line-height: 1.55;
    }
    main {
      max-width: 920px;
      margin: 0 auto;
      padding: 42px 20px 56px;
    }
    header {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 20px;
      align-items: start;
      margin-bottom: 22px;
    }
    h1 {
      margin: 0;
      font-size: clamp(34px, 7vw, 64px);
      line-height: 1;
      letter-spacing: 0;
    }
    .sub {
      margin-top: 12px;
      color: var(--muted);
      font-size: 15px;
    }
    .badge {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: var(--green);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 30px;
      font-weight: 800;
    }
    .statement, .item {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .statement {
      padding: 16px 18px;
      color: #3d454d;
      margin-bottom: 18px;
    }
    .toolbar {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 14px;
      margin: 18px 0;
      flex-wrap: wrap;
    }
    .item {
      display: grid;
      grid-template-columns: 44px 1fr;
      gap: 14px;
      padding: 18px;
      margin: 12px 0;
    }
    .rank {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--green);
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 800;
    }
    .item.top .rank { background: var(--red); }
    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 6px;
    }
    .tag {
      color: var(--green);
      background: var(--green-soft);
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 700;
    }
    h2 {
      margin: 0 0 8px;
      font-size: clamp(18px, 3.2vw, 24px);
      line-height: 1.3;
      letter-spacing: 0;
    }
    a {
      color: inherit;
      text-decoration: none;
    }
    a:hover { color: var(--green); }
    p {
      margin: 0;
      color: #3d454d;
    }
    .reason {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 8px;
      background: var(--amber-soft);
      color: var(--amber);
      font-size: 13px;
    }
    footer, .loading {
      margin-top: 24px;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }
    @media (max-width: 620px) {
      main { padding-top: 28px; }
      header { grid-template-columns: 1fr; }
      .badge { width: 58px; height: 58px; font-size: 24px; }
      .item { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>今日十条</h1>
        <div id="edition" class="sub">正在加载</div>
      </div>
      <div class="badge">10</div>
    </header>
    <section id="statement" class="statement">本期新闻按公共重要性、来源多样性和主题配额生成，不基于个人阅读行为排序。</section>
    <div class="toolbar">
      <span>公共新闻简报</span>
      <span>不基于个人行为推荐</span>
    </div>
    <section id="items" class="loading">正在读取今日新闻...</section>
    <footer>新闻顺序由服务端每日版本决定，客户端不会根据点击、停留或收藏进行重排。</footer>
  </main>
  <script>
    const API_URL = 'https://rrufsrfkmypxvwyggtwm.supabase.co/functions/v1/editions/today?region=cn&language=zh-CN';
    const labels = {
      domestic: '国内',
      international: '国际',
      finance: '财经',
      technology: '科技',
      health: '健康',
      education: '教育',
      society: '社会',
      sports: '体育',
      perspective: '视角'
    };

    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    function timeText(value) {
      return new Date(value).toLocaleTimeString('zh-CN', {
        hour: '2-digit',
        minute: '2-digit',
        timeZone: 'Asia/Shanghai'
      });
    }

    async function loadDailyNews() {
      const response = await fetch(API_URL, {
        headers: { Accept: 'application/json' }
      });
      if (!response.ok) {
        throw new Error(`API ${response.status}`);
      }
      return response.json();
    }

    loadDailyNews()
      .then((payload) => {
        document.title = `今日十条 - ${payload.edition.date}`;
        document.getElementById('edition').textContent = `${payload.edition.date} / ${payload.edition.region} / ${payload.edition.language}`;
        document.getElementById('statement').textContent = payload.edition.statement;
        document.getElementById('items').className = '';
        document.getElementById('items').innerHTML = payload.items.map((item) => {
          const article = item.article;
          const category = labels[article.category] ?? article.category;
          return `
            <article class="item ${item.position <= 3 ? 'top' : ''}">
              <div class="rank">${item.position}</div>
              <div>
                <div class="meta">
                  <span class="tag">${escapeHtml(category)}</span>
                  <span>${escapeHtml(article.source)}</span>
                  <span>${escapeHtml(timeText(article.publishedAt))}</span>
                </div>
                <h2><a href="${escapeHtml(article.url)}" target="_blank" rel="noreferrer">${escapeHtml(article.title)}</a></h2>
                <p>${escapeHtml(article.summary)}</p>
                <div class="reason">入选理由：${escapeHtml(item.selectionReason)}</div>
              </div>
            </article>
          `;
        }).join('');
      })
      .catch(() => {
        document.getElementById('items').textContent = '加载失败，请稍后重试。';
      });
  </script>
</body>
</html>
